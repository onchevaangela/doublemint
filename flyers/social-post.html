<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Double Mint Instagram post (1080x1080)</title>
<link rel="stylesheet" href="flyer.css">
<style>
  .sheet { width: 1080px; height: 1080px; padding: 80px; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 560px; }
  h1 { font-size: 112px; margin-top: 50px; }
  .sub { font-size: 30px; margin-top: 24px; font-weight: 500; }
  .from { display: flex; gap: 22px; margin-top: 56px; }
  .from > div { width: 270px; padding: 26px 0 24px; border: 2px solid var(--line); border-radius: 26px; background: var(--panel); }
  .from .k { font-size: 18px; }
  .from .price { font-size: 76px; margin-top: 10px; }
  .from small { display: block; font-size: 18px; color: var(--muted); margin-top: 8px; font-weight: 600; }
  .cta { margin-top: 64px; font-size: 30px; padding: 22px 44px; }
</style>
</head>
<body>
<div class="sheet">
  <img class="logo" src="../assets/img/logo.svg" alt="Double Mint Detailing">
  <h1 class="big">Fresh as <span class="mint">mint.</span></h1>
  <p class="sub muted">Hand detailing for cars, SUVs &amp; trucks</p>
  <div class="from">
    <div><div class="eyebrow k">Exterior</div><div class="price"><sup>$</sup>60</div><small>starting at</small></div>
    <div><div class="eyebrow k">Interior</div><div class="price"><sup>$</sup>200</div><small>starting at</small></div>
    <div><div class="eyebrow k">Inside &amp; out</div><div class="price mint"><sup>$</sup>230</div><small>starting at</small></div>
  </div>
  <div class="pill pill-mint cta">Book: 862 238 0550</div>
</div>
</body>
</html>
